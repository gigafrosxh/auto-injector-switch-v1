# Teria: Anmeldung im Teria-Design
[greeter]
background=/usr/share/backgrounds/teria/login.jpg
user-background=false
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
font-name=Ubuntu 14
xft-antialias=true
xft-hintstyle=hintslight
default-user-image=#teria
clock-format=%H:%M  ·  %A, %d. %B
indicators=~host;~spacer;~clock;~spacer;~a11y;~power
position=50%,center 58%,center
panel-position=top
hide-user-image=false
round-user-image=true
