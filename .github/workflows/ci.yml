name: CI

on:
  push:
    branches: [main, 'image/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: 'Teria-Image bauen'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck -x -s bash os/teria-base/usr/bin/teria os/teria-base/usr/lib/teria/lib.sh \
            os/teria-base/usr/lib/teria/emmc-guard os/teria-base/usr/lib/teria/firstboot \
            os/teria-base/usr/lib/teria/perf tools/*.sh
          shellcheck -s sh os/teria-base/usr/lib/teria/make-os-release os/teria-base/etc/update-motd.d/05-teria \
            os/teria-base/DEBIAN/postinst os/teria-base/DEBIAN/prerm os/teria-base/DEBIAN/postrm \
            os/teria-base/usr/lib/teria/reboot-hekate os/teria-shell/usr/lib/teria-shell/session \
            os/teria-shell/usr/lib/teria-shell/desktop-mode os/teria-shell/DEBIAN/postinst os/teria-shell/DEBIAN/preinst os/teria-shell/DEBIAN/postrm
          python3 -m py_compile os/teria-shell/usr/bin/teria-shell os/teria-shell/usr/lib/teria-shell/server.py os/teria-base/usr/lib/teria/pkg
          python3 -c "import json; json.load(open('os/teria-shell/usr/lib/teria-shell/catalog.json'))"

      - name: Version aus Tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Pakete bauen
        run: |
          tools/build-deb.sh "${{ steps.v.outputs.version }}"
          tools/build-injector-zip.sh "${{ steps.v.outputs.version }}"
          ls -la dist

      - name: Paket pruefen (Installation im Container)
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:24.04 bash -euc '
            apt-get -qq update >/dev/null
            apt-get -qq install -y /dist/teria-base_*_all.deb >/dev/null
            . /etc/os-release; echo "$PRETTY_NAME"; [ "$NAME" = Teria ]; [ "$ID" = ubuntu ]
            teria version; teria guard status
            apt-get -qq remove -y teria-base >/dev/null
            . /etc/os-release; echo "nach Entfernen: $PRETTY_NAME"; [ "$NAME" = Ubuntu ]'
          docker run --rm -v "$PWD/dist:/dist" debian:trixie bash -euc '
            apt-get -qq update >/dev/null
            apt-get -qq install -y /dist/teria-base_*_all.deb >/dev/null
            . /etc/os-release; echo "$PRETTY_NAME"; [ "$ID" = teria ]; [ "$ID_LIKE" = debian ]
            apt-get -qq install -y --no-install-recommends /dist/teria-shell_*_all.deb >/dev/null
            cd /usr/lib/teria-shell && TERIA_SHELL_MOCK=1 python3 -c "import server,urllib.request,json; server.serve(8790); assert json.load(urllib.request.urlopen(\"http://127.0.0.1:8790/api/state\"))[\"battery\"][\"capacity\"]==78; print(\"teria-shell ok\")"
            apt-get -qq remove -y teria-shell >/dev/null
            apt-get -qq remove -y teria-base >/dev/null
            . /etc/os-release; [ "$ID" = debian ]; echo "nach Entfernen: $PRETTY_NAME"'

      - uses: actions/upload-artifact@v4
        with:
          name: teria-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Release-Assets anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            pre=""; [[ "$tag" == *-* ]] && pre="--prerelease"
            notes="release-notes/${tag#v}.md"; [ -f "$notes" ] || notes=/dev/null
            gh release create "$tag" dist/* --title "Teria $tag" --notes-file "$notes" $pre
          fi

  image:
    # Eigenstaendiges Teria-Image (Debian trixie arm64), nativ auf arm64 gebaut
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/image/') || (github.event_name == 'workflow_dispatch' && inputs.image)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y mmdebstrap debian-archive-keyring e2fsprogs zip gnupg dpkg-dev >/dev/null

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(cat VERSION)-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Image bauen
        run: sudo tools/build-image.sh "${{ steps.v.outputs.version }}" dist

      - name: Image pruefen
        run: |
          v="${{ steps.v.outputs.version }}"
          unzip -l "dist/teria-$v-sd.zip"
          mkdir -p /tmp/chk && cd /tmp/chk && unzip -q "$GITHUB_WORKSPACE/dist/teria-$v-sd.zip"
          sha256sum -c SHA256SUMS
          cat switchroot/install/l4t.* > /tmp/teria.img
          sudo e2fsck -fn /tmp/teria.img
          [ "$(sudo e2label /tmp/teria.img)" = SWR-TER ]
          sudo debugfs -R 'cat /usr/lib/os-release' /tmp/teria.img
          sudo debugfs -R 'ls -l /lib/modules' /tmp/teria.img
          grep -E '^(nvidia-l4t-x11|xserver-xorg-core|libx11-6|switch-bsp|teria-base)\b' "$GITHUB_WORKSPACE/dist/teria-$v.manifest"
          ls -la "$GITHUB_WORKSPACE/dist"
          size=$(stat -c %s "$GITHUB_WORKSPACE/dist/teria-$v-sd.zip"); echo "ZIP: $size Bytes"
          [ "$size" -lt 2147483648 ] || { echo "ZIP groesser als 2 GiB (GitHub-Limit)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: teria-image-${{ steps.v.outputs.version }}
          path: dist/teria-*
          compression-level: 0
          retention-days: 7

      - name: Image an Release anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist/teria-*-sd.zip dist/teria-*.manifest --clobber
